services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sgw
      POSTGRES_PASSWORD: sgw
      POSTGRES_DB: sgw
    ports:
      - '5433:5432'
    volumes:
      - sgw-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgw']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  sgw-db:
